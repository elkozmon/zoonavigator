name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [ master, main ]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    outputs:
      update-type: ${{ steps.dependabot-metadata.outputs.update-type }}
      package-ecosystem: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
    steps:
      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3

  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - metadata
    permissions:
      contents: write
      pull-requests: write
    # Actions are pinned by major tag, so their updates are always semver-major.
    if: |
      needs.metadata.outputs.update-type == 'version-update:semver-minor' ||
      needs.metadata.outputs.update-type == 'version-update:semver-patch' ||
      (
        needs.metadata.outputs.package-ecosystem == 'github_actions' &&
        needs.metadata.outputs.update-type == 'version-update:semver-major'
      )
    env:
      HAS_CI_APP: ${{ secrets.CI_APP_CLIENT_ID != '' && secrets.CI_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Approve pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"

      # A merge made with GITHUB_TOKEN does not trigger push workflows such as
      # Publish, so auto-merge is enabled as a GitHub App when one is configured.
      - name: Create CI app token
        id: app-token
        if: env.HAS_CI_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [[ "${HAS_CI_APP}" != "true" ]]; then
            echo "::notice::CI app is not configured; falling back to GITHUB_TOKEN, so the merge will not trigger push workflows."
          fi

          auto_merge_enabled="$(
            gh pr view "$PR_URL" \
              --json autoMergeRequest \
              --jq '.autoMergeRequest != null'
          )"

          if [[ "${auto_merge_enabled}" == "true" ]]; then
            echo "Auto-merge is already enabled."
            exit 0
          fi

          gh pr merge --auto --merge --delete-branch "$PR_URL"
